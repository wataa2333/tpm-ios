name: TPM
schemes:
  TPM:
    build:
      targets:
        TPM: all
        TPMTests: [test]
    test:
      targets: [TPMTests]
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '27.0'
targets:
  TPM:
    type: application
    platform: iOS
    sources: [TPM]
    info:
      path: TPM/Info.plist
      properties:
        NSAppTransportSecurity:
          NSExceptionDomains:
            tpm.forbetter.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.tpm
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 单据工作台
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '6.0'
        CURRENT_PROJECT_VERSION: '1'
        MARKETING_VERSION: '0.3.0'
  TPMTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TPMTests]
    dependencies:
      - target: TPM
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '6.0'

